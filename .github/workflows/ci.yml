name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Gating: stylua + luacheck must both pass, for real.
  #
  # stylua used to be advisory here, pending the one-time repo-wide `stylua .`
  # pass the existing style predated. That pass has landed: 105 files
  # reformatted, with the four headless suites reporting the same pass/fail
  # counts before and after, so nothing behavioural moved with it. Keeping the
  # step advisory now would only let the formatting drift straight back.
  lint:
    name: lint (stylua + luacheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: stylua (check)
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck 1.2.0

      - name: luacheck
        run: luacheck lua docs/BINDINGS.lua TESTS

  # Real gate: the headless test suite, every spec file .testing.lua selects,
  # run by testing.nvim (scripts/test.sh). lib.nvim is checked out as a sibling
  # so the sibling-checkout lookup of TESTS/minimal_init.lua (../lib.nvim)
  # finds it -- filetree.nvim's command layer and several features depend on
  # it at runtime.
  #
  # refs/run.lua is fixture-based: it copies TESTS/refs/fixtures/<lang>/ to a
  # scratch dir and renames a module through the real feature, asserting every
  # referencing file follows. It needs no tree plugin and no LSP server, and
  # runs on either candidate-search path -- ripgrep when the image has it, the
  # capped fallback walk when it does not (both verified, same 54 checks).
  test:
    name: tests (headless) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - name: Checkout filetree.nvim
        uses: actions/checkout@v5
        with:
          path: filetree.nvim

      - name: Checkout lib.nvim
        uses: actions/checkout@v5
        with:
          repository: WKDSteve/lib.nvim
          path: lib.nvim
          ref: ci-verified

      # ui.nvim: filetree.refs.ui does `require("ui.kit")` unconditionally
      # at module load time (not lazy, not pcall'd -- see that file's own
      # header), and filetree.refs is itself required eagerly from
      # filetree.setup(). So the very first setup() call in ANY spec file
      # needs ui.nvim resolvable, and the candidate search of
      # TESTS/minimal_init.lua already expects a sibling checkout here -- this
      # step was once missing, which is why every spec that calls
      # setup() failed on a real `ui.kit` load error, and every later
      # setup() call in the same nvim process then hit Lua's cached
      # "loop or previous error loading module" instead of that real one.
      - name: Checkout ui.nvim
        uses: actions/checkout@v5
        with:
          repository: WKDSteve/ui.nvim
          path: ui.nvim
          ref: ci-verified

      # The test sheet TESTS/sheets/diag-badges-neotree.sheet.lua runs a real neo-tree in its child
      # editor (TESTS/minimal_init_sheet_neotree.lua finds these as siblings). Pinned: the sheet's
      # screen snapshots were taken with exactly these commits. The real-neo-tree suites
      # (adapter_lines.lua, ...) use a checkout they find on their own only at these refs:
      # TESTS/neotree_pins.lua reads them from here (`repository:` + a 40-hex `ref:` per step).
      - name: Checkout neo-tree.nvim (pinned)
        uses: actions/checkout@v5
        with:
          repository: nvim-neo-tree/neo-tree.nvim
          path: neo-tree.nvim
          ref: 1a14083046d96e88e361d1da00761c40d45012f3
      - name: Checkout nui.nvim (pinned)
        uses: actions/checkout@v5
        with:
          repository: MunifTanjim/nui.nvim
          path: nui.nvim
          ref: 10fc361835c856ba4233ef5ea135b919bf3dce97
      - name: Checkout plenary.nvim (pinned)
        uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          path: plenary.nvim
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "WKDSteve/testing.nvim"
          path: testing.nvim
          ref: ci-verified
      # TESTS/trash_linux_container_spec.lua runs the Linux trash backend in a container
      # (testing.container); without the image it reports n/a instead of running.
      - name: Build the Linux container image
        if: runner.os == 'Linux'
        run: podman build -t localhost/testing-linux:1 testing.nvim/containers/linux
      - name: Run test suites
        working-directory: filetree.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          set -e
          bash scripts/test.sh --json "$RUNNER_TEMP/testing-ir.json"
      - name: Conformance gate
        working-directory: filetree.nvim
        run: bash scripts/test.sh conformance
      # The IR is what a reporter or a person reads to find out WHICH case failed on WHICH platform.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testing-ir-${{ matrix.os }}
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 14

      # The FEATURE REFERENCE section of doc/filetree.txt is generated from
      # docs/FEATURES/*.md and the binding catalog. Without this gate it would
      # go stale the same way it did before it existed -- a new feature ships,
      # `:help filetree-<it>` resolves to nothing, and nobody notices until
      # somebody goes looking. Lives here rather than in the lint job because
      # it loads the plugin, so it needs the lib.nvim checkout.
      - name: doc/filetree.txt is in step with docs/FEATURES
        working-directory: filetree.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n --clean --headless -u NONE -l scripts/gen_vimdoc_reference.lua --check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-test-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  # After a green push only: moves the branch `ci-verified` that the other repositories of the fleet check this one out
  # from (testing.nvim docs/WORKFLOW-CI.md, "Dependencies come from ci-verified"). It waits for lint and the tests of all
  # three systems, so the branch means green on every one of them. Copied from the generated workflows of the fleet.
  publish-ci-verified:
    name: publish ci-verified branch
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Hosted, not self-hosted: the job pushes with write access, and on the maintainer's machine the global pre-push
    # hook cannot see the old tip in this shallow checkout and refuses every move of ci-verified.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Never move ci-verified backwards along main's history: two pushes can finish
      # out of order, and the older run must not overwrite the newer verified commit.
      # If main's history was rewritten (compare status 'diverged'), ci-verified is
      # deliberately reset to the new verified commit. The
      # lookup fails closed (an API or network error stops the job instead of
      # falling through to a push) and the update carries a lease on the tip it
      # compared against.
      - name: Publish ci-verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # The default shell of a step without `shell:` is `bash -e` without pipefail:
          # a failing `git ls-remote` would be hidden by `cut` and read as "no branch".
          set -o pipefail
          # Look the branch up on the remote instead of inferring "missing" from an API
          # error: a failed lookup must stop the job, not fall through to a push.
          # A concurrent run may move ci-verified between the comparison and the push
          # (lease rejected). Re-read the tip and compare again: if the newer run is
          # already ahead of this commit there is nothing left to publish, so that is
          # success, not a failure.
          for attempt in 1 2 3 4; do
            tip=$(git ls-remote --heads origin refs/heads/ci-verified | cut -f1)
            if [ -z "$tip" ]; then
              # First publish. A plain push creates the branch and is rejected if a
              # concurrent run created it first; the next attempt then compares.
              git push origin HEAD:refs/heads/ci-verified && exit 0
              echo "first publish failed on attempt $attempt (another run may have created the branch)"
              [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
              continue
            fi
            status=$(gh api "repos/$REPO/compare/$tip...$SHA" --jq .status)
            case "$status" in
              behind | identical)
                echo "ci-verified ($tip) is '$status' relative to $SHA (published or superseded); leaving it alone"
                exit 0
                ;;
              ahead | diverged)
                # The lease makes the server refuse the update if ci-verified moved since
                # the comparison, so an older run can never overwrite a newer one.
                git push origin HEAD:refs/heads/ci-verified --force-with-lease="refs/heads/ci-verified:$tip" && exit 0
                echo "push failed on attempt $attempt (lease rejected or another error, see the git output above)"
                [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
                ;;
              *)
                echo "::error::unexpected compare status '$status' for $tip...$SHA"
                exit 1
                ;;
            esac
          done
          echo "::error::could not publish ci-verified after 4 attempts"
          exit 1
